version: '3.8'

# Development-specific overrides
services:
  # Development setup with hot reload
  larsa-academy-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3278:3278"
    environment:
      - PORT=3278
      - MONGODB_URI=mongodb://mongodb:27017/larsa_academy_dev
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - IS_LOCAL=true
      - GO_ENV=development
    volumes:
      - .:/app
      - /app/vendor
    depends_on:
      - mongodb
      - redis
      - nats
    networks:
      - larsa-network
    restart: unless-stopped
    command: ["air", "-c", ".air.toml"]

  # Development database with different name
  mongodb:
    environment:
      - MONGO_INITDB_DATABASE=larsa_academy_dev

networks:
  larsa-network:
    driver: bridge
